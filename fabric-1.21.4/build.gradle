// TpSetWarp - build.gradle
// Fabric Loom, ciblant Minecraft 1.21.4.
// Utilise les mappings officielles Mojang (comme sous Forge) : le code métier
// (warp/, storage/, command/, util/, teleport/, lang/) n'a donc pas eu besoin
// d'être réécrit avec des noms de classes différents.

plugins {
    id 'fabric-loom' version '1.9-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Loom ajoute déjà les dépôts nécessaires pour Minecraft/Fabric.
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Utilisé par WarpStorage / LanguageStorage pour la persistance JSON.
    implementation 'com.google.code.gson:gson:2.10.1'
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
